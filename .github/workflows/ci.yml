name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  native-and-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        env:
          WAVE_SKIP_NATIVE_DOWNLOAD: "1"
      - run: node scripts/build-native.mjs
      - run: node scripts/prebuild-smoke.mjs
      - run: bun test packages/wavedb/test packages/wave-cli/test
      - run: node scripts/node-smoke.mjs
