name: Release native packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            pkg: wavedb-darwin-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg: wavedb-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            pkg: wavedb-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg: wavedb-win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        env:
          WAVE_SKIP_NATIVE_DOWNLOAD: "1"
      - run: node scripts/build-native.mjs --target ${{ matrix.target }}
      - run: node scripts/sync-native-packages.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: packages/${{ matrix.pkg }}

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: native-artifacts
      - name: Collect release .node binaries
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for pkg in wavedb-darwin-arm64 wavedb-linux-arm64 wavedb-linux-x64 wavedb-win32-x64; do
            if [ -d "native-artifacts/${pkg}" ]; then
              cp native-artifacts/${pkg}/*.node release-assets/ 2>/dev/null || true
            fi
          done
          ls -la release-assets
          test "$(ls -1 release-assets/*.node 2>/dev/null | wc -l)" -ge 1
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
