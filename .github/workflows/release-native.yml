name: Release native packages

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            pkg: wavedb-darwin-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            pkg: wavedb-darwin-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg: wavedb-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            pkg: wavedb-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg: wavedb-win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx @napi-rs/cli build --release --target ${{ matrix.target }} --cargo-cwd crates/wave-napi -o native --output-dir packages/wavedb/native
      - run: node scripts/sync-native-packages.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: packages/${{ matrix.pkg }}
