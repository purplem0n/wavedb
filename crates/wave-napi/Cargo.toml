[package]
name = "wave-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wave-core = { path = "../wave-core" }
napi = { version = "3", default-features = false, features = ["napi9", "serde-json"] }
napi-derive = "3"
serde_json = "1"
parking_lot = "0.12"

[build-dependencies]
napi-build = "2"
